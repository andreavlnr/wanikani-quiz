<!doctype html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7c3aed"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Kani Choice"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><link rel="stylesheet" href="./styles.css"><title>Kani Choice v4</title></head><body>
<main class="app"><header><div><h1>亀 Kani Choice</h1><div class="sub">WaniKani feleletválasztós gyakorló · v4</div></div></header>
<section id="setup" class="card grid"><div><h2>Beállítás</h2><p class="hint">A token csak ezen az eszközön marad. Elég egy csak olvasási jogosultságú WaniKani v2 API token.</p></div><label>WaniKani API token<input id="token" type="password" autocomplete="off" placeholder="Másold ide a tokenedet"></label><div class="actions"><button id="connect" class="primary">Kapcsolódás és szintek betöltése</button><button id="forget" class="ghost">Mentett token törlése</button></div><div id="status" class="status">Még nincs kapcsolat.</div>
<div id="options" class="hidden grid"><div class="grid two"><label>Tananyagtípus<select id="subjectType"><option value="kanji">Csak kanji</option><option value="vocabulary">Csak vocabulary</option><option value="radical">Csak radikál</option><option value="kanji-vocabulary" selected>Kanji és vocabulary</option><option value="mixed">Minden vegyesen</option></select></label><label>Gyakorlási mód<select id="studyMode"><option value="reading">Olvasat</option><option value="meaning">Jelentés</option><option value="mixed" selected>Olvasat és jelentés vegyesen</option></select><span class="hint">Radikálnál és kana-only vocabularynál jelentést kérdezünk.</span></label><label>Válaszlehetőségek<select id="choiceCount"><option>4</option><option>6</option><option selected>8</option><option>10</option></select></label><label>Kérdések száma<select id="questionCount"><option>10</option><option selected>20</option><option>30</option><option>50</option></select></label><label>Olvasat elfogadása<select id="readingMode"><option value="primary" selected>Elsődleges olvasat</option><option value="any">Bármely elfogadott olvasat</option></select></label></div><div><h3>Gyakorlandó szintek</h3><div class="actions compact"><button id="selectCurrent" class="secondary">Csak jelenlegi</button><button id="selectUpToCurrent" class="secondary">1–jelenlegi</button><button id="clearLevels" class="ghost">Törlés</button></div><div id="levels" class="level-picker"></div></div><button id="start" class="primary">Kvíz indítása</button></div></section>
<section id="quiz" class="card hidden"><div class="topbar"><div class="progress"><div id="progressBar"></div></div><div id="counter" class="score"></div><button id="quit" class="ghost">Kilépés</button></div><div class="prompt"><div id="kind" class="kind"></div><div id="character" class="character"></div><div id="question" class="question"></div></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div></section>
<section id="result" class="card hidden summary"><h2>Kész! 🎉</h2><div id="resultScore" class="big"></div><div id="resultText" class="hint"></div><div id="missed" class="missed"></div><div class="actions center"><button id="retryWrong" class="primary hidden">Hibásak újra</button><button id="again" class="secondary">Ugyanezt újra</button><button id="back" class="ghost">Beállítások</button></div></section></main><script type="module" src="./src/main.js"></script></body></html>
